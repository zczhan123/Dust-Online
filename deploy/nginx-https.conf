# 尘起时刻 · 联机版 · nginx 站点配置（路线乙：域名 + https + wss）
#
# 前提：
#   1. 域名已解析到本机（A 记录）
#   2. 证书已就位（certbot 申请，或已有证书文件）
#   3. 80 / 443 已放行
#
# 把 example.com 全部换成你的域名；证书路径按实际修改。
# 证书用 certbot 申请（推荐）：
#   sudo apt install -y certbot python3-certbot-nginx     # Debian/Ubuntu
#   sudo certbot --nginx -d example.com                   # 自动改本配置、自动续期
# （也可以先手动申请，再用下面的证书路径）

# 80 → 443
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx ≥ 1.25 写法；老版本改成：listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    # 确认长期用 https 后再打开 HSTS：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/dust/www;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        expires 30d;
    }

    # 联机中继（wss）：/ws → 本机 8787
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
