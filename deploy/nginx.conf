# 尘起时刻 · 联机版 · nginx 站点配置（路线甲：IP 直连 / http + ws）
#
# 适用：暂时没有域名+证书，先用 http 把游戏跑起来。
# 做法：把本文件放进 nginx 的站点目录（见 README 第 5 节），改 root / server_name 后 reload。
#
# ★ 重要：必须部署在**域名根路径**（/），不要放子目录。
#   首页行草字体走绝对路径 /fonts/，放子目录会 404（字体回退成系统字体）。

server {
    listen 80;
    listen [::]:80;
    server_name _;                 # 有域名就换成域名；IP 直连保持 _

    # 网页文件（部署包里 www/ 的内容）
    root /opt/dust/www;
    index index.html;

    # 压缩（woff2 本身已压缩，无需再压）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 首页不缓存：发新版后玩家能立刻拿到新 index（版本一致性另由 APP_BUILD 校验）
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 带 hash 的静态资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        expires 30d;
    }

    # 联机中继（WebSocket）：/ws → 本机 8787
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # 必须有：WebSocket 升级
        proxy_set_header Connection "upgrade";       # 必须有
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;                    # 长连接：别让 nginx 60 秒掐断
        proxy_send_timeout 3600s;
    }

    # 单页应用兜底（本游戏没有前端路由，加着无害）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
